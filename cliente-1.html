<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trámites Fiscales - WhatsApp</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            background: white;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 500;
        }

        .header .status {
            font-size: 12px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f0f0f0;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.user .bubble {
            background: #25D366;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .option-button {
            display: block;
            width: 100%;
            background: none;
            border: 1px solid #25D366;
            color: #25D366;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
        }

        .option-button:hover {
            background: #25D36620;
        }

        .option-button:active {
            transform: scale(0.98);
        }

        .form-section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #25D366;
            box-shadow: 0 0 0 2px #25D36630;
        }

        .payment-section {
            background: linear-gradient(135deg, #fff8e1 0%, #fffde7 100%);
            border: 2px solid #fbc02d;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .payment-title {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
        }

        .payment-info {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .payment-info div {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .payment-info .label {
            color: #666;
            font-weight: 500;
        }

        .payment-info .value {
            color: #333;
            font-weight: 600;
            font-family: monospace;
        }

        .clabe {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            color: #25D366;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            margin: 8px 0;
        }

        .upload-section {
            border: 2px dashed #25D366;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f0f8f5;
        }

        .upload-section:hover {
            background: #d4f5e8;
            border-color: #128C7E;
        }

        .upload-section p {
            font-size: 13px;
            color: #25D366;
            font-weight: 500;
        }

        #paymentFile {
            display: none;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid #ef5350;
        }

        .file-uploaded {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid #4caf50;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #25D366;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-section {
            display: flex;
            padding: 12px 16px;
            gap: 8px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .input-section input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            font-family: inherit;
        }

        .input-section input:focus {
            outline: none;
            border-color: #25D366;
        }

        .input-section button {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .input-section button:hover {
            background: #128C7E;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .order-tracking {
            padding: 8px 0;
        }

        .tracking-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .real-time-indicator {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .tracking-status {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .status-dot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #999;
        }

        .dot.active {
            background: #25D366;
            color: white;
        }

        .dot.completed {
            background: #4caf50;
            color: white;
        }

        .dot-label {
            font-size: 11px;
            text-align: center;
            color: #666;
        }

        .tracking-info {
            background: #f0f8f5;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-box">
            <div class="header">
                <span>💬</span>
                <div>
                    <h1>Trámites Fiscales</h1>
                    <div class="status">WhatsApp Business</div>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-section">
                <input type="text" id="input" placeholder="Escribe tu mensaje..." />
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURACIÓN FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCeKjVHiV-w6pFZWpwOzfKmBNlm3F-aMrg",
            authDomain: "tramites-fiscales-bd.firebaseapp.com",
            projectId: "tramites-fiscales-bd",
            storageBucket: "tramites-fiscales-bd.appspot.com",
            messagingSenderId: "450905272833",
            databaseURL: "https://tramites-fiscales-bd-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // ==================== ESTADO GLOBAL ====================
        let currentStep = 'servicio';
        let selectedService = null;
        const formData = {
            rfc: '',
            curp: '',
            idcif: '',
            phone: '',
            price: 0,
            paymentImage: null,
            paymentImageUrl: null
        };

        // ==================== FUNCIONES AUXILIARES ====================
        function addMessage(text, isUser = false, isHTML = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (isHTML) {
                bubble.innerHTML = text;
            } else {
                bubble.textContent = text;
            }

            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'typingIndicator';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function initChat() {
            addMessage('¡Hola! 👋 Bienvenido a nuestro servicio de trámites fiscales. ¿Qué trámite necesitas?', false, false);
            
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    removeTyping();
                    addMessage(`
                        <button class="option-button" onclick="selectService('constancia')">📄 Constancia de Situación Fiscal</button>
                        <button class="option-button" onclick="selectService('acta')">👶 Acta de Nacimiento</button>
                    `, false, true);
                    currentStep = 'servicio';
                }, 800);
            }, 1000);
        }

        function selectService(service) {
            selectedService = service;
            const serviceLabel = service === 'constancia' ? '📄 Constancia de Situación Fiscal' : '👶 Acta de Nacimiento';
            
            addMessage(serviceLabel, true);
            
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    removeTyping();
                    const formHTML = service === 'constancia' ? `
                        Perfecto, necesitamos los siguientes datos:
                        <div class="form-section">
                            <div class="form-group">
                                <label>RFC (opcional):</label>
                                <input type="text" id="rfcInput" placeholder="Ej: ABC123DEF456" maxlength="13" oninput="formData.rfc = this.value">
                            </div>
                            <div class="form-group">
                                <label>CURP (opcional):</label>
                                <input type="text" id="curpInput" placeholder="Ej: AAAA000000HDFRRR00" maxlength="18" oninput="formData.curp = this.value">
                            </div>
                            <div class="form-group">
                                <label>Teléfono WhatsApp:</label>
                                <input type="tel" id="phoneInput" placeholder="Ej: 5512345678" oninput="formData.phone = this.value">
                            </div>
                            <div style="background: #f0f8f5; padding: 12px; border-radius: 8px; margin-top: 12px;">
                                <strong>💵 Costo:</strong> $150.00 MXN
                            </div>
                            <button class="option-button" style="background: #25D366; color: white; border-color: #25D366; margin-top: 16px;" onclick="confirmData('${service}', 150)">Continuar</button>
                        </div>
                    ` : `
                        Perfecto, necesitamos los siguientes datos:
                        <div class="form-section">
                            <div class="form-group">
                                <label>CURP:</label>
                                <input type="text" id="curpInput" placeholder="Ej: AAAA000000HDFRRR00" maxlength="18" oninput="formData.curp = this.value">
                            </div>
                            <div class="form-group">
                                <label>Identificador CIF:</label>
                                <input type="text" id="idcifInput" placeholder="Ej: 12345678" oninput="formData.idcif = this.value">
                            </div>
                            <div class="form-group">
                                <label>Teléfono WhatsApp:</label>
                                <input type="tel" id="phoneInput" placeholder="Ej: 5512345678" oninput="formData.phone = this.value">
                            </div>
                            <div style="background: #f0f8f5; padding: 12px; border-radius: 8px; margin-top: 12px;">
                                <strong>💵 Costo:</strong> $200.00 MXN
                            </div>
                            <button class="option-button" style="background: #25D366; color: white; border-color: #25D366; margin-top: 16px;" onclick="confirmData('${service}', 200)">Continuar</button>
                        </div>
                    `;

                    addMessage(formHTML, false, true);
                    currentStep = 'form';
                }, 800);
            }, 500);
        }

        function confirmData(service, price) {
            formData.price = price;

            if (!formData.phone) {
                alert('❌ Por favor ingresa tu teléfono');
                return;
            }

            if (service === 'constancia' && !formData.rfc && !formData.curp) {
                alert('❌ Debes ingresar al menos RFC o CURP');
                return;
            }

            if (service === 'acta' && !formData.curp) {
                alert('❌ Por favor ingresa tu CURP');
                return;
            }

            const confirmHTML = `
                ✅ Datos confirmados. Ahora realiza el pago.
                <div class="payment-section">
                    <div class="payment-title">💳 Información de Pago</div>
                    
                    <div class="payment-info">
                        <div>
                            <span class="label">Monto a pagar:</span>
                            <span class="value">$${price}.00 MXN</span>
                        </div>
                    </div>

                    <div class="payment-info">
                        <div style="flex-direction: column; align-items: flex-start;">
                            <span class="label">CLABE:</span>
                            <div class="clabe">7309 6900 0006 5189 52</div>
                        </div>
                    </div>

                    <div class="payment-info">
                        <div>
                            <span class="label">Nombre:</span>
                        </div>
                        <div style="justify-content: flex-start; padding: 8px 0;">
                            PAUL DAVID MARQUEZ ELVIRA
                        </div>
                    </div>

                    <div class="payment-info">
                        <div>
                            <span class="label">Banco:</span>
                            <span class="value">CLIP</span>
                        </div>
                    </div>

                    <div style="margin-top: 16px;">
                        <p style="font-size: 12px; color: #666; margin-bottom: 8px;">📸 Sube el comprobante de pago:</p>
                        <div class="upload-section" onclick="document.getElementById('paymentFile').click()">
                            <p>Click aquí para subir imagen</p>
                            <input type="file" id="paymentFile" accept="image/*" onchange="handleFileUpload(event)">
                        </div>
                        <div id="fileStatus"></div>
                    </div>

                    <button class="option-button" style="background: #25D366; color: white; border-color: #25D366; margin-top: 16px;" onclick="submitPayment()">✅ Enviar Comprobante</button>
                </div>
            `;

            addMessage(confirmHTML, false, true);
            currentStep = 'payment';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const status = document.getElementById('fileStatus');
            
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    status.innerHTML = '<div class="error-message">❌ Archivo muy grande. Máximo 2MB.</div>';
                    formData.paymentImage = null;
                    return;
                }

                if (!file.type.startsWith('image/')) {
                    status.innerHTML = '<div class="error-message">❌ Solo se aceptan imágenes (JPG, PNG, GIF).</div>';
                    formData.paymentImage = null;
                    return;
                }

                status.innerHTML = '<div style="text-align: center;"><div class="spinner"></div> <span style="margin-left: 8px;">Procesando imagen...</span></div>';

                const reader = new FileReader();
                reader.onload = function(e) {
                    formData.paymentImage = e.target.result;
                    status.innerHTML = '<div class="file-uploaded">✅ Imagen cargada correctamente</div>';
                };
                reader.onerror = function() {
                    status.innerHTML = '<div class="error-message">❌ Error al cargar la imagen. Intenta de nuevo.</div>';
                    formData.paymentImage = null;
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadPaymentImageToStorage(order, imageDataUrl) {
            return new Promise((resolve, reject) => {
                try {
                    const arr = imageDataUrl.split(',');
                    const mime = arr[0].match(/:(.*?);/)[1];
                    const bstr = atob(arr[1]);
                    let n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    
                    while (n--) {
                        u8arr[n] = bstr.charCodeAt(n);
                    }
                    
                    const blob = new Blob([u8arr], { type: mime });
                    const storageRef = storage.ref(`payment-proofs/${order.id}.jpg`);
                    const uploadTask = storageRef.put(blob);
                    
                    uploadTask.on('state_changed',
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            console.log('Progreso: ' + progress + '%');
                        },
                        (error) => {
                            reject(error);
                        },
                        () => {
                            uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                                resolve(downloadURL);
                            });
                        }
                    );
                } catch (error) {
                    reject(error);
                }
            });
        }

        function submitPayment() {
            if (!formData.paymentImage) {
                alert('❌ Por favor, sube una imagen del comprobante de pago');
                return;
            }

            const requiredFields = selectedService === 'constancia' 
                ? [formData.rfc || formData.curp, formData.phone, formData.paymentImage]
                : [formData.curp, formData.phone, formData.paymentImage];

            if (requiredFields.some(f => !f)) {
                alert('❌ Faltan datos. Por favor revisa el formulario.');
                return;
            }

            const fileStatus = document.getElementById('fileStatus');
            fileStatus.innerHTML = '<div style="text-align: center;"><div class="spinner"></div> <span style="margin-left: 8px;">Enviando comprobante...</span></div>';
            
            const submitBtn = document.querySelector('button[onclick="submitPayment()"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Procesando...';

            const order = {
                id: 'ORD-' + Date.now(),
                service: selectedService,
                formData: {
                    rfc: formData.rfc,
                    curp: formData.curp,
                    idcif: formData.idcif,
                    phone: formData.phone
                },
                price: formData.price,
                status: 'pendiente',
                timestamp: new Date().toLocaleString(),
                downloadLink: null,
                hasPaymentImage: true
            };

            uploadPaymentImageToStorage(order, formData.paymentImage)
                .then((imageUrl) => {
                    console.log('✅ Imagen subida:', imageUrl);
                    order.paymentImageUrl = imageUrl;
                    
                    let orders = JSON.parse(localStorage.getItem('orders') || '[]');
                    orders.push(order);
                    localStorage.setItem('orders', JSON.stringify(orders));

                    return syncOrderWithFirebase(order);
                })
                .then(() => {
                    fileStatus.innerHTML = '';
                    addMessage('✅ Comprobante enviado', true);
                    
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            removeTyping();
                            const serviceLabel = selectedService === 'constancia' ? '📄 Constancia de Situación Fiscal' : '👶 Acta de Nacimiento';
                            addMessage(
                                `✅ ¡Perfecto! Tu solicitud ha sido recibida.\n\n📋 Número de orden: <strong>${order.id}</strong>\n📦 Trámite: ${serviceLabel}\n💵 Monto: $${formData.price}.00\n📞 Teléfono: ${formData.phone}\n⏱️ Tiempo de procesamiento: 10-15 minutos\n\n⚠️ Conserva tu número de orden. Te contactaremos por WhatsApp cuando esté listo.`,
                                false,
                                true
                            );
                            
                            showOrderTracking(order.id);
                            
                            const messagesDiv = document.getElementById('messages');
                            const lastBubble = messagesDiv.lastChild.querySelector('.bubble');
                            lastBubble.innerHTML += `
                                <button class="option-button" style="margin-top: 12px;" onclick="downloadOrderReceipt('${order.id}', '${serviceLabel}', ${formData.price})">📥 Descargar Comprobante</button>
                                <button class="option-button" onclick="location.reload()">📋 Realizar otro trámite</button>
                            `;
                            currentStep = 'confirmado';
                            
                            setTimeout(() => {
                                updateOrderStatus(order.id, 'en_proceso');
                            }, 3000);
                        }, 1000);
                    }, 500);
                })
                .catch((error) => {
                    console.error('❌ Error:', error);
                    fileStatus.innerHTML = `<div class="error-message">❌ Error al enviar: ${error.message}</div>`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✅ Enviar Comprobante';
                });
        }

        function updateOrderStatus(orderId, status) {
            const tracking = document.getElementById('orderTracking-' + orderId);
            if (!tracking) return;

            if (status === 'en_proceso') {
                tracking.innerHTML = `
                    <div class="order-tracking">
                        <div class="tracking-title">
                            <span class="real-time-indicator"></span>
                            📦 Rastreador de Orden
                        </div>
                        <div class="tracking-status">
                            <div class="status-dot">
                                <div class="dot completed">✓</div>
                                <div class="dot-label">Enviado</div>
                            </div>
                            <div class="status-dot">
                                <div class="dot completed">✓</div>
                                <div class="dot-label">En Verificación</div>
                            </div>
                            <div class="status-dot">
                                <div class="dot active">3</div>
                                <div class="dot-label">Procesando</div>
                            </div>
                        </div>
                        <div class="tracking-info">
                            ⏳ Tu documento se está procesando. Pronto recibirás un mensaje por WhatsApp.
                        </div>
                    </div>
                `;
            }
        }

        function downloadOrderReceipt(orderId, service, price) {
            const timestamp = new Date().toLocaleString();
            const receipt = `
COMPROBANTE DE SOLICITUD DE TRAMITE
====================================
Numero de Orden: ${orderId}
Fecha: ${timestamp}

TRAMITE SOLICITADO
${service}

DATOS DE CONTACTO
Telefono: ${formData.phone}

INFORMACION DE PAGO
Monto: $${price}.00 MXN
CLABE: 7309 6900 0006 5189 52
Beneficiario: PAUL DAVID MARQUEZ ELVIRA
Banco: CLIP

ESTADO DE TU SOLICITUD
Estado: Pendiente de Verificacion
Proximo paso: Te contactaremos por WhatsApp

INSTRUCCIONES
1. Guarda este comprobante
2. Tu numero de orden es: ${orderId}
3. Usalo si necesitas hacer consultas
4. Te contactaremos al telefono registrado

Gracias por usar nuestro servicio.
            `;

            const blob = new Blob([receipt], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Comprobante-${orderId}.txt`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function sendMessage() {
            const input = document.getElementById('input');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    removeTyping();
                    const responses = [
                        '¿En qué puedo ayudarte con tus trámites?',
                        'Entendido, ¿necesitas constancia fiscal o acta de nacimiento?',
                        'Claro, estoy listo para ayudarte.'
                    ];
                    const response = responses[Math.floor(Math.random() * responses.length)];
                    addMessage(response, false);
                }, 800);
            }, 300);
        }

        function showOrderTracking(orderId) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.id = 'orderTracking-' + orderId;
            bubble.innerHTML = `
                <div class="order-tracking">
                    <div class="tracking-title">
                        <span class="real-time-indicator"></span>
                        📦 Rastreador de Orden en Tiempo Real
                    </div>
                    <div class="tracking-status">
                        <div class="status-dot">
                            <div class="dot completed">✓</div>
                            <div class="dot-label">Enviado</div>
                        </div>
                        <div class="status-dot">
                            <div class="dot active">2</div>
                            <div class="dot-label">Verificacion</div>
                        </div>
                        <div class="status-dot">
                            <div class="dot">3</div>
                            <div class="dot-label">Entrega</div>
                        </div>
                    </div>
                    <div class="tracking-info">
                        Tu documento sera entregado en las proximas 2 horas
                    </div>
                </div>
            `;
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function syncOrderWithFirebase(order) {
            return new Promise((resolve, reject) => {
                db.ref('orders/' + order.id).set({
                    id: order.id,
                    service: order.service,
                    formData: {
                        rfc: order.formData.rfc,
                        curp: order.formData.curp,
                        idcif: order.formData.idcif,
                        phone: order.formData.phone
                    },
                    price: order.price,
                    status: 'pendiente',
                    timestamp: order.timestamp,
                    downloadLink: null,
                    paymentImageUrl: order.paymentImageUrl || null
                }).then(() => {
                    console.log('✅ Orden sincronizada con Firebase');
                    resolve();
                }).catch((error) => {
                    console.error('❌ Error:', error);
                    reject(error);
                });
            });
        }

        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        initChat();
        document.getElementById('input').focus();
    </script>
</body>
</html>
