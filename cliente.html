<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tramites Fiscales - WhatsApp</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; }
        .container { display: flex; height: 100vh; background: white; }
        .chat-box { display: flex; flex-direction: column; width: 100%; max-width: 500px; background: #fff; border-right: 1px solid #e0e0e0; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 16px; font-weight: 500; }
        .header .status { font-size: 12px; opacity: 0.9; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #f0f0f0; }
        .message { display: flex; gap: 8px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 18px; word-wrap: break-word; line-height: 1.4; font-size: 14px; }
        .message.user .bubble { background: #25D366; color: white; border-bottom-right-radius: 4px; }
        .message.ai .bubble { background: white; color: #333; border-bottom-left-radius: 4px; border: 1px solid #e0e0e0; }
        .option-button { display: block; width: 100%; background: none; border: 1px solid #25D366; color: #25D366; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 8px; transition: all 0.2s; text-align: left; font-family: inherit; }
        .option-button:hover { background: #25D36620; }
        .form-section { background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; margin-top: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #25D366; box-shadow: 0 0 0 2px rgba(37,211,102,0.2); }
        .payment-section { background: linear-gradient(135deg, #fff8e1 0%, #fffde7 100%); border: 2px solid #fbc02d; border-radius: 12px; padding: 16px; margin-top: 12px; }
        .payment-title { font-weight: 600; font-size: 14px; color: #333; margin-bottom: 12px; }
        .payment-info { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
        .payment-info div { margin-bottom: 8px; display: flex; justify-content: space-between; }
        .clabe { background: #f5f5f5; padding: 12px; border-radius: 6px; font-family: monospace; font-weight: bold; color: #25D366; text-align: center; font-size: 16px; letter-spacing: 2px; margin: 8px 0; }
        .upload-section { border: 2px dashed #25D366; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; background: #f0f8f5; }
        .upload-section:hover { background: #d4f5e8; }
        .upload-section p { font-size: 13px; color: #25D366; font-weight: 500; }
        #paymentFile { display: none; }
        .error-message { background: #ffebee; color: #c62828; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 8px; border: 1px solid #ef5350; }
        .file-uploaded { background: #e8f5e9; color: #2e7d32; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 8px; border: 1px solid #4caf50; }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #25D366; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .input-section { display: flex; padding: 12px 16px; gap: 8px; border-top: 1px solid #e0e0e0; background: white; }
        .input-section input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; }
        .input-section button { background: #25D366; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: 500; }
        .typing-indicator { display: flex; gap: 4px; align-items: center; }
        .typing-indicator span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.7; } 30% { transform: translateY(-10px); opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-box">
            <div class="header">
                <span>💬</span>
                <div>
                    <h1>Tramites Fiscales</h1>
                    <div class="status">WhatsApp Business</div>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-section">
                <input type="text" id="input" placeholder="Escribe tu mensaje..." />
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let db, storage;
        
        const firebaseConfig = {
            apiKey: "AIzaSyCeKjVHiV-w6pFZWpwOzfKmBNlm3F-aMrg",
            authDomain: "tramites-fiscales-bd.firebaseapp.com",
            projectId: "tramites-fiscales-bd",
            storageBucket: "tramites-fiscales-bd.appspot.com",
            messagingSenderId: "450905272833",
            databaseURL: "https://tramites-fiscales-bd-default-rtdb.firebaseio.com"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            storage = firebase.storage();
            console.log('Firebase OK');
        } catch (e) {
            console.log('Firebase no disponible:', e.message);
        }

        let currentStep = 'servicio';
        let selectedService = null;
        const formData = {
            rfc: '',
            curp: '',
            idcif: '',
            phone: '',
            price: 0,
            paymentImage: null
        };

        function addMessage(text, isUser, isHTML) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user' : 'ai');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (isHTML) {
                bubble.innerHTML = text;
            } else {
                bubble.textContent = text;
            }
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'typingIndicator';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function initChat() {
            addMessage('Hola, bienvenido a tramites fiscales. Que tramite necesitas?', false, false);
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    removeTyping();
                    const html = '<button class="option-button" onclick="selectService(\'constancia\')">Constancia de Situacion Fiscal</button><button class="option-button" onclick="selectService(\'acta\')">Acta de Nacimiento</button>';
                    addMessage(html, false, true);
                }, 800);
            }, 1000);
        }

        function selectService(service) {
            selectedService = service;
            const label = service === 'constancia' ? 'Constancia de Situacion Fiscal' : 'Acta de Nacimiento';
            addMessage(label, true, false);
            
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    removeTyping();
                    const form = service === 'constancia' ? 
                        'Necesitamos tus datos:<div class="form-section"><div class="form-group"><label>RFC (opcional):</label><input type="text" placeholder="ABC123DEF456" maxlength="13" oninput="formData.rfc = this.value"></div><div class="form-group"><label>CURP (opcional):</label><input type="text" placeholder="AAAA000000HDFRRR00" maxlength="18" oninput="formData.curp = this.value"></div><div class="form-group"><label>Telefono WhatsApp:</label><input type="tel" placeholder="5512345678" oninput="formData.phone = this.value"></div><div style="background: #f0f8f5; padding: 12px; border-radius: 8px; margin-top: 12px;"><strong>Costo: $150.00 MXN</strong></div><button class="option-button" style="background: #25D366; color: white; border-color: #25D366; margin-top: 16px;" onclick="confirmData(\'constancia\', 150)">Continuar</button></div>'
                        : 'Necesitamos tus datos:<div class="form-section"><div class="form-group"><label>CURP:</label><input type="text" placeholder="AAAA000000HDFRRR00" maxlength="18" oninput="formData.curp = this.value"></div><div class="form-group"><label>Identificador CIF:</label><input type="text" placeholder="12345678" oninput="formData.idcif = this.value"></div><div class="form-group"><label>Telefono WhatsApp:</label><input type="tel" placeholder="5512345678" oninput="formData.phone = this.value"></div><div style="background: #f0f8f5; padding: 12px; border-radius: 8px; margin-top: 12px;"><strong>Costo: $200.00 MXN</strong></div><button class="option-button" style="background: #25D366; color: white; border-color: #25D366; margin-top: 16px;" onclick="confirmData(\'acta\', 200)">Continuar</button></div>';
                    addMessage(form, false, true);
                }, 800);
            }, 500);
        }

        function confirmData(service, price) {
            formData.price = price;
            
            if (!formData.phone) {
                alert('Por favor ingresa tu telefono');
                return;
            }

            const html = 'Datos confirmados. Realiza el pago:<div class="payment-section"><div class="payment-title">Informacion de Pago</div><div class="payment-info"><div><span style="color: #666;">Monto:</span><span style="color: #333; font-weight: 600;">$' + price + '.00 MXN</span></div></div><div class="payment-info"><div style="flex-direction: column; align-items: flex-start;"><span style="color: #666; font-weight: 500;">CLABE:</span><div class="clabe">7309 6900 0006 5189 52</div></div></div><div class="payment-info"><div><span style="color: #666; font-weight: 500;">Nombre:</span></div><div style="padding: 8px 0;">PAUL DAVID MARQUEZ ELVIRA</div></div><div style="margin-top: 16px;"><p style="font-size: 12px; color: #666; margin-bottom: 8px;">Sube el comprobante de pago:</p><div class="upload-section" onclick="document.getElementById(\'paymentFile\').click()"><p>Click aqui para subir imagen</p><input type="file" id="paymentFile" accept="image/*" onchange="handleFileUpload(event)"></div><div id="fileStatus"></div></div><button class="option-button" style="background: #25D366; color: white; border-color: #25D366; margin-top: 16px;" onclick="submitPayment()">Enviar Comprobante</button></div>';
            addMessage(html, false, true);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const status = document.getElementById('fileStatus');
            
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    status.innerHTML = '<div class="error-message">Archivo muy grande. Maximo 2MB.</div>';
                    return;
                }
                
                status.innerHTML = '<div style="text-align: center;"><div class="spinner"></div> <span style="margin-left: 8px;">Procesando imagen...</span></div>';
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    formData.paymentImage = e.target.result;
                    status.innerHTML = '<div class="file-uploaded">Imagen cargada correctamente</div>';
                };
                reader.onerror = function() {
                    status.innerHTML = '<div class="error-message">Error al cargar imagen</div>';
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadPaymentImageToStorage(order, imageDataUrl) {
            return new Promise((resolve) => {
                if (!storage) {
                    resolve(null);
                    return;
                }

                try {
                    const arr = imageDataUrl.split(',');
                    const mime = arr[0].match(/:(.*?);/)[1];
                    const bstr = atob(arr[1]);
                    let n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    while (n--) u8arr[n] = bstr.charCodeAt(n);
                    
                    const blob = new Blob([u8arr], { type: mime });
                    const storageRef = storage.ref('payment-proofs/' + order.id + '.jpg');
                    const uploadTask = storageRef.put(blob);
                    
                    uploadTask.on('state_changed', null, (error) => {
                        console.log('Error:', error);
                        resolve(null);
                    }, () => {
                        uploadTask.snapshot.ref.getDownloadURL().then((url) => {
                            resolve(url);
                        });
                    });
                } catch (e) {
                    resolve(null);
                }
            });
        }

        function submitPayment() {
            if (!formData.paymentImage) {
                alert('Por favor sube una imagen del comprobante');
                return;
            }

            const fileStatus = document.getElementById('fileStatus');
            fileStatus.innerHTML = '<div style="text-align: center;"><div class="spinner"></div> <span style="margin-left: 8px;">Enviando...</span></div>';
            
            const order = {
                id: 'ORD-' + Date.now(),
                service: selectedService,
                formData: {
                    rfc: formData.rfc,
                    curp: formData.curp,
                    idcif: formData.idcif,
                    phone: formData.phone
                },
                price: formData.price,
                status: 'pendiente',
                timestamp: new Date().toLocaleString(),
                hasPaymentImage: true
            };

            uploadPaymentImageToStorage(order, formData.paymentImage).then((imageUrl) => {
                if (imageUrl) order.paymentImageUrl = imageUrl;
                
                let orders = JSON.parse(localStorage.getItem('orders') || '[]');
                orders.push(order);
                localStorage.setItem('orders', JSON.stringify(orders));

                if (db) {
                    db.ref('orders/' + order.id).set({
                        id: order.id,
                        service: order.service,
                        formData: order.formData,
                        price: order.price,
                        status: 'pendiente',
                        timestamp: order.timestamp,
                        paymentImageUrl: imageUrl || null
                    }).catch((e) => console.log('Firebase error:', e));
                }

                fileStatus.innerHTML = '';
                addMessage('Comprobante enviado', true, false);
                setTimeout(() => {
                    showTyping();
                    setTimeout(() => {
                        removeTyping();
                        const msg = 'Perfecto! Tu solicitud ha sido recibida.\\nNumero de orden: ' + order.id + '\\nMonto: $' + formData.price + '.00\\nTelefono: ' + formData.phone + '\\n\\nTe contactaremos por WhatsApp cuando este listo.';
                        addMessage(msg, false, false);
                    }, 1000);
                }, 500);
            });
        }

        function sendMessage() {
            const input = document.getElementById('input');
            const message = input.value.trim();
            if (!message) return;
            addMessage(message, true, false);
            input.value = '';
        }

        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        initChat();
        document.getElementById('input').focus();
    </script>
</body>
</html>
